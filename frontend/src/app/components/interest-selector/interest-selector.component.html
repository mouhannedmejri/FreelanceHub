<div class="interest-selector" [class.compact]="compact">
  <div class="group" *ngFor="let group of interestGroups">
    <h4>{{ group.label }}</h4>
    <div class="chips">
      <button
        type="button"
        *ngFor="let item of group.items"
        [class.active]="isSelected(item)"
        (click)="toggle(item)"
      >
        {{ item }}
      </button>
    </div>
  </div>
</div>
