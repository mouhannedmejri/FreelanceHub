<ion-content class="welcome-content" [fullscreen]="true">
  <!-- Skip Button -->
  <button class="skip-btn" (click)="skip()" *ngIf="!isLastSlide" id="welcome-skip-btn">
    Skip
    <ion-icon name="chevron-forward-outline"></ion-icon>
  </button>

  <!-- Slide Track (swipeable) -->
  <div class="slide-track"
    (touchstart)="onTouchStart($event)"
    (touchend)="onTouchEnd($event)"
  >
    <div class="slide-wrapper" [style.transform]="'translateX(-' + (currentIndex * 100) + '%)'">

      <div class="slide-container" *ngFor="let slide of slides; let i = index">

        <!-- Floating decoration orbs -->
        <div class="orb orb-1" [style.background]="slide.accentColor + '20'"></div>
        <div class="orb orb-2" [style.background]="slide.accentColor + '15'"></div>

        <!-- Hero illustration -->
        <div class="slide-illustration">
          <div class="illustration-glow" [style.background]="'radial-gradient(circle, ' + slide.accentColor + '30 0%, transparent 70%)'"></div>
          <img [src]="slide.image" [alt]="slide.title" class="slide-image" />
        </div>

        <!-- Feature badge -->
        <div class="feature-badge" [style.border-color]="slide.accentColor + '40'">
          <div class="feature-badge-icon" [style.background]="'linear-gradient(135deg, ' + slide.accentColor + ', ' + slide.accentColor + 'cc)'">
            <ion-icon [name]="slide.icon"></ion-icon>
          </div>
          <span>{{ i === 0 ? 'Discover Talent' : i === 1 ? 'Get Noticed' : i === 2 ? 'Stay Protected' : 'Free Access' }}</span>
        </div>

        <!-- Text content -->
        <div class="slide-text">
          <h1 class="slide-title">
            {{ slide.title }}<br>
            <span class="slide-title-accent" [style.color]="slide.accentColor">{{ slide.subtitle }}</span>
          </h1>
          <p class="slide-description">{{ slide.description }}</p>
        </div>

      </div>

    </div>
  </div>

  <!-- Bottom section -->
  <div class="welcome-bottom">
    <!-- Dot indicators -->
    <div class="dots">
      <button
        *ngFor="let slide of slides; let i = index"
        class="dot"
        [class.active]="currentIndex === i"
        [style.background]="currentIndex === i ? slides[currentIndex].accentColor : ''"
        (click)="goToSlide(i)"
        [id]="'welcome-dot-' + i"
      ></button>
    </div>

    <!-- CTA Button -->
    <button class="welcome-cta-btn" (click)="nextSlide()" id="welcome-cta-btn">
      <span>{{ buttonLabel }}</span>
      <ion-icon [name]="buttonIcon"></ion-icon>
    </button>

    <!-- Already have account -->
    <p class="login-prompt" *ngIf="isLastSlide">
      Already have an account?
      <a routerLink="/auth" [queryParams]="{tab: 'login'}">Sign In</a>
    </p>
  </div>

</ion-content>
