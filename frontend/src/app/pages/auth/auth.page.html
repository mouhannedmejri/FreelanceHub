<ion-content class="auth-content" [fullscreen]="true">
  <div class="auth-container">
    <button class="guest-cta" (click)="browseAsGuest()" id="browse-guest-btn">
      Explore first ->
    </button>

    <div class="hero-card">
      <img src="assets/icon/favicon.png" alt="Hero" />
      <div class="hero-overlay"></div>
      <div class="hero-copy">
        <h2>Personalize Your Experience</h2>
        <p>Connect with talent, projects, and digital products.</p>
      </div>
    </div>

    <div class="logo-section">
      <div class="logo-icon">
        <ion-icon name="briefcase-outline"></ion-icon>
      </div>
      <h1 class="logo-text">Freelance<span>Hub</span></h1>
      <p class="logo-subtitle">Discover opportunities your way</p>
    </div>

    <div class="auth-card">
      <div class="tab-switcher">
        <button
          class="tab-btn"
          [class.active]="activeTab === 'login'"
          (click)="switchTab('login')"
          id="login-tab-btn"
        >
          Sign In
        </button>
        <button
          class="tab-btn"
          [class.active]="activeTab === 'register'"
          (click)="switchTab('register')"
          id="register-tab-btn"
        >
          Sign Up
        </button>
      </div>

      <div class="tab-content" *ngIf="activeTab === 'login'">
        <div class="form-group">
          <label class="form-label">Email</label>
          <div class="input-wrapper">
            <ion-icon name="mail-outline" class="input-icon"></ion-icon>
            <input
              type="email"
              class="form-input"
              placeholder="votre@email.com"
              [(ngModel)]="loginEmail"
              id="login-email-input"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <input
              type="password"
              class="form-input"
              placeholder="••••••••"
              [(ngModel)]="loginPassword"
              id="login-password-input"
            />
          </div>
          <button class="inline-link" (click)="onForgotPassword()" id="forgot-password-link">Forgot Password?</button>
        </div>

        <button class="primary-btn" (click)="onLogin()" id="login-submit-btn">
          <ion-icon name="log-in-outline"></ion-icon>
          Sign In
        </button>

        <div class="divider">
          <span>or</span>
        </div>

        <div class="social-buttons">
          <button class="social-btn google" id="google-login-btn" (click)="onSocialLogin('google')">
            <ion-icon name="logo-google"></ion-icon>
            Google
          </button>
          <button class="social-btn facebook" id="facebook-login-btn" (click)="onSocialLogin('facebook')">
            <ion-icon name="logo-facebook"></ion-icon>
            Facebook
          </button>
        </div>
        <p class="bottom-link">Doesn't have an account? <button (click)="switchTab('register')">Sign Up</button></p>
      </div>

      <div class="tab-content" *ngIf="activeTab === 'register'">
        <div class="form-group">
          <label class="form-label">Full Name</label>
          <div class="input-wrapper">
            <ion-icon name="person-outline" class="input-icon"></ion-icon>
            <input
              type="text"
              class="form-input"
              placeholder="Jean Dupont"
              [(ngModel)]="registerFullName"
              id="register-name-input"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Email</label>
          <div class="input-wrapper">
            <ion-icon name="mail-outline" class="input-icon"></ion-icon>
            <input
              type="email"
              class="form-input"
              placeholder="votre@email.com"
              [(ngModel)]="registerEmail"
              id="register-email-input"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <input
              type="password"
              class="form-input"
              placeholder="Minimum 6 caractères"
              [(ngModel)]="registerPassword"
              id="register-password-input"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Confirm Password</label>
          <div class="input-wrapper">
            <ion-icon name="lock-closed-outline" class="input-icon"></ion-icon>
            <input
              type="password"
              class="form-input"
              placeholder="Repeat password"
              [(ngModel)]="registerConfirmPassword"
              id="register-confirm-password-input"
            />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">I am a...</label>
          <div class="role-selector">
            <button
              class="role-card"
              [class.selected]="registerRole === 'freelancer'"
              (click)="selectRole('freelancer')"
              id="role-freelancer-btn"
            >
              <ion-icon name="briefcase-outline"></ion-icon>
              <span>Freelancer</span>
              <small>I want to work</small>
            </button>
            <button
              class="role-card"
              [class.selected]="registerRole === 'client'"
              (click)="selectRole('client')"
              id="role-client-btn"
            >
              <ion-icon name="person-outline"></ion-icon>
              <span>Client</span>
              <small>I want to hire</small>
            </button>
          </div>
        </div>

        <div class="form-group" *ngIf="registerRole === 'client'">
          <label class="form-label">What are you looking for?</label>
          <app-interest-selector [(selectedInterests)]="registerInterests" [compact]="true"></app-interest-selector>
        </div>

        <button
          class="primary-btn"
          (click)="onRegister()"
          id="register-submit-btn"
        >
          <ion-icon name="person-add-outline"></ion-icon>
          Create Account
        </button>
        <p class="bottom-link">Already have an account? <button (click)="switchTab('login')">Sign In</button></p>
      </div>
    </div>
  </div>
</ion-content>
